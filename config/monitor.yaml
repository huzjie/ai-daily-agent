# AI Daily Agent - Monitor Module Configuration
# 监控模块独立配置文件

monitor:
  # 报告配置
  report:
    period_days: 7        # 报告统计周期（天）
    top_n: 5              # Top N 仓库排名数量

  # 数据清理配置
  data_cleaner:
    retention_days: 90    # 数据保留天数
    enabled: true         # 是否启用自动清理

  # 监控指标配置
  metrics:
    - stars
    - forks
    - watchers
    - issues

  # 里程碑配置
  star_milestones:
    - 1
    - 5
    - 10
    - 50
    - 100

# GitHub 配置（需要在主 config.yaml 中配置）
# github:
#   username: your-username
#   token: your-token
#   repo_prefix: ai-daily-
